[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dpx-yul"
version = "0.1.0"
description = "🔥 Enterprise Yul & EVM Assembly Static Analyzer: Memory Management, Storage Packing, Transient Storage (EIP-1153), Custom Errors, Syscalls & GoF 23."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Bivex Team", email = "dev@bivex.io" }
]
keywords = ["yul", "evm", "assembly", "inline-assembly", "solidity", "solady", "eip-1153", "static-analysis", "gof", "sarif"]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
dpx-yul = "pattern_detector.adapters.inbound.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pattern_detector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=src/pattern_detector --cov-report=term-missing"
